name: Frontend CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend-ci:
    name: Frontend Lint & Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Validate Commit Messages
      uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed

    - name: Setup Node.js Environment
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 'lts/*'

    - name: Cache Node Modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: mobile/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('mobile/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install JS Dependencies
      run: |
        cd mobile
        npm ci --ignore-scripts --no-audit --no-fund

    - name: NPM Security Audit (informational)
      continue-on-error: true
      run: |
        cd mobile
        npm audit --audit-level=high

    - name: ESLint Code Quality Check
      run: |
        cd mobile
        npx --no-install eslint . --ext .js,.jsx,.ts,.tsx

    - name: TypeScript Type Check
      run: |
        cd mobile
        npx --no-install tsc --noEmit

    - name: Run Jest Unit Tests
      run: |
        cd mobile
        npx --no-install jest --passWithNoTests