name: DevOps CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'

jobs:
  actionlint:
    name: Validate GitHub Actions Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Actionlint
        uses: reviewdog/action-actionlint@d290e336d5a743810aef4404f757dc862276d2ae

      - name: Test Orchestration Scripts (Zero-Config Sync)
        run: |
          chmod +x scripts/generate_secrets.sh
          # The script will detect CI=true and bypass interactive prompts
          ./scripts/generate_secrets.sh
          # Ensure files were actually created
          test -f backend/.env
          test -f mobile/.env
          test -f firmware/esp32_config.env