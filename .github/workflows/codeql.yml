name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'cpp', 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

    - name: Initialize CodeQL
      uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql/codeql-config.yml

    - name: Install PlatformIO
      if: matrix.language == 'cpp'
      run: |
        pip install --only-binary :all: platformio==6.1.19

    - name: Inject CI Environment Variables
      if: matrix.language == 'cpp'
      run: cp esp32_config.env.example esp32_config.env
      working-directory: firmware

    - name: Build firmware
      if: matrix.language == 'cpp'
      run: pio run
      working-directory: firmware

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
