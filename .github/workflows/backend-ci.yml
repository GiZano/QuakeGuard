name: Backend CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-ci:
    name: Backend Test & Security
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      
    - name: Validate Commit Messages
      uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed

    - name: Setup Python Environment
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Cache Pip Dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python Dependencies & Security Tools
      run: |
        python -m pip install pip==24.0
        pip install --only-binary :all: bandit==1.8.3 safety==3.3.1 pytest==8.3.4 httpx==0.28.1 pytest-asyncio==0.25.3
        if [ -f backend/requirements.txt ]; then pip install --only-binary :all: --require-hashes -r backend/requirements.txt; fi

    - name: Run Bandit (Static Security Linter)
      run: bandit -r backend/src

    - name: Run Pytest Unit Tests (standalone)
      run: |
        cd backend
        export PYTHONPATH=$PYTHONPATH:.
        python -m pytest tests/unit/ -v --tb=short -x

    - name: Run Safety (Dependency Vulnerability Scanner)
      continue-on-error: true
      env:
        SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
      run: |
        if [ -f backend/requirements.txt ]; then 
          safety scan -r backend/requirements.txt
        fi

    - name: Initialize Docker Infrastructure
      env:
        POSTGRES_DB: ${{ secrets.CI_POSTGRES_DB || 'quakeguard_test' }}
        POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER || 'quakeguard' }}
        POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci-postgres-password' }}
        IOT_API_KEY: "ci-test-key-123"
        MOBILE_WS_TOKEN: "ci-ws-token-456"
        ENROLLMENT_TOKEN: "ci-enroll-token-789"
        AI_REPORT_ENABLED: "false"
        API_PORT: 8000
        MQTT_PORT: 1883  # 1. FIXED: Added so docker-compose can map the broker port outwards
      run: |
        cd backend
        docker compose up -d --build
        
        echo "Waiting for database readiness..."
        timeout 30s bash -c "until docker compose exec -T postgres pg_isready -U ${POSTGRES_USER}; do sleep 2; done"
        
        echo "Waiting for MQTT Broker readiness..."
        timeout 30s bash -c 'until nc -z localhost 1883; do sleep 1; done' # 2. FIXED: Prevents race conditions
        
        docker compose ps

    - name: Run Pytest Integration Tests (with Docker)
      run: |
        cd backend
        export PYTHONPATH=$PYTHONPATH:.
        python -m pytest tests/integration/ -v --tb=short -x || echo "No integration tests found"

    - name: Run Geo Spatial Integration Tests (real PostGIS + Redis)
      run: |
        cd backend
        docker run -d --name geo-test-pg \
          -e POSTGRES_DB=quakeguard_test \
          -e POSTGRES_USER=quakeguard \
          -e POSTGRES_PASSWORD=ci-postgres-password \
          -p 55432:5432 postgis/postgis:15-3.4-alpine
        docker run -d --name geo-test-redis -p 56379:6379 redis:7-alpine
        echo "Waiting for spatial test infrastructure readiness..."
        timeout 60s bash -c "until nc -z localhost 55432 && nc -z localhost 56379; do sleep 2; done"
        DATABASE_URL="postgresql://quakeguard:ci-postgres-password@localhost:55432/quakeguard_test" \
        REDIS_URL="redis://localhost:56379/0" \
        python -m pytest tests/integration/test_geo_integration.py -v --tb=short
        docker rm -f geo-test-pg geo-test-redis

    - name: Run TimescaleDB Integration Tests (real hypertable)
      run: |
        cd backend
        DATABASE_URL="postgresql://quakeguard:ci-postgres-password@localhost:5432/quakeguard_test" \
        python -m pytest tests/integration/test_timescale_integration.py -v --tb=short

    - name: Run Zone Readings Integration Tests (real PostGIS)
      run: |
        cd backend
        docker run -d --name zone-test-pg \
          -e POSTGRES_DB=quakeguard_test \
          -e POSTGRES_USER=quakeguard \
          -e POSTGRES_PASSWORD=ci-postgres-password \
          -p 55433:5432 postgis/postgis:15-3.4-alpine
        echo "Waiting for zone test infrastructure readiness..."
        timeout 60s bash -c "until nc -z localhost 55433; do sleep 2; done"
        DATABASE_URL="postgresql://quakeguard:ci-postgres-password@localhost:55433/quakeguard_test" \
        python -m pytest tests/integration/test_zone_readings.py -v --tb=short
        docker rm -f zone-test-pg

    - name: Execute Critical Stress Test
      env:
        API_URL: "http://localhost:8000"
        NUM_SENSORS: 150
        CONCURRENCY_LIMIT: 50
        IOT_API_KEY: "ci-test-key-123"
        MQTT_BROKER: "localhost" # 3. FIXED: Explicitly forces aiomqtt to target the host pipeline
        MQTT_PORT: 1883          # 4. FIXED: Explicitly passes port to stress test runtime
      run: |
        cd backend
        export PYTHONPATH=$PYTHONPATH:.
        python -m tests.stress_test

    - name: Retrieve System Logs on Failure
      if: failure()
      run: |
        cd backend
        docker compose logs