name: Build and Push Backend Service

on:
  # Trigger the workflow on push events to the 'main' branch.
  # Execution is limited to changes in the backend directory or this workflow definition.
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'

env:
  # Define the container registry (GitHub Container Registry).
  REGISTRY: ghcr.io
  # Define the image name, appending '-backend' to distinguish it within the repository.
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    # Grant necessary permissions to the GITHUB_TOKEN for package publishing.
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Check out the repository code.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Commit Messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed

      # Step 2: Authenticate with the GitHub Container Registry.
      - name: Log in to the Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Extract metadata (tags, labels) for the Docker image.
      # This generates tags like 'latest' and the git SHA for versioning.
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # Step 4: Build the Docker image and push it to GHCR.
      # The build context is explicitly set to the 'api' subdirectory 
      # inside 'backend' where the Dockerfile and source code reside.
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}